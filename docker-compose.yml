# Local/self-hosted stack: the app + Postgres. Secrets come from a .env file (copy .env.example) — none are stored here.
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: s2s
      POSTGRES_USER: s2s
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s2s -d s2s"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports: ["3001:3001"]
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://s2s:${POSTGRES_PASSWORD}@db:5432/s2s
      DATABASE_SSL: "false"   # private compose network
    volumes: [uploads:/data/uploads]

volumes:
  pgdata:
  uploads:
