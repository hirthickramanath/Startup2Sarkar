# Render Blueprint — deploys the app as one web service. Postgres is external (e.g. Supabase) via DATABASE_URL.
# Secrets marked sync:false are entered once in the Render dashboard; they are never stored in this file.
services:
  - type: web
    name: startup2sarkar
    runtime: docker
    plan: starter            # persistent disks need a paid plan; free plans sleep and have an ephemeral disk
    region: singapore        # closest Render region to India
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: s2s-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: JWT_SECRET, generateValue: true }
      - { key: COOKIE_SECRET, generateValue: true }
      - { key: FIELD_ENCRYPTION_KEY, generateValue: true }
      - { key: DATABASE_URL, sync: false }
      - { key: ADMIN_EMAIL, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GEMINI_API_KEY, sync: false }
